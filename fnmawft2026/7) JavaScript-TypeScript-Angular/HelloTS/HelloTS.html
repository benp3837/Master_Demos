<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloTS</title>
</head>
<body>
    
    <h3>Hello TypeScipt, we'll write Angular apps with you</h3>

    <div style="display:flex; flex-direction: column; 
    justify-content: center; align-items: center; 
    width:25%; margin:auto; border: solid 3px; border-radius: 15%; 
    padding: 3%; background-color: burlywood;">
        <h4>Register for an Account (sends POST to Record Store backend)</h4>

        <input id="usernameInput" type="text" placeholder="A Unique Username">
        <input id="passwordInput" type="password" placeholder="A Strong Password">
        <input id="emailInput" type="text" placeholder="A Valid Email">
        <!-- We'll hardcode role for now, still need to set it as default in server -->

        <button id="registerButton" style="margin-top: 5%">Register</button>
    </div>


    <!-- Why not HelloTS.ts?? The browser can't read Typescript. Our TS file must be TRANSPILED to Js -->
    <script src="HelloTS.js"></script>

</body>
</html>
