<div class="col-md-4 mx-auto" *ngIf="!orderService.cart[0]">
    <h2>Cart Empty! Do you not love your daughter?</h2>
</div>

<div class="col-md-4 mx-auto" *ngIf="orderService.cart[0]">
    <h2>Your Cart:</h2>

    <div *ngFor="let item of cartSummary">

        <div class="card">
            <div class="card-body">
                <div class="text-end">
                    <button (click)="deleteItem(item.id)">X</button>
                </div>
                <h5 class="card-title">{{item.name}}</h5>
                <p class="card-text">${{item.price}}</p>
                <p class="card-text">x{{item.quantity}}</p>
            </div>
        </div>

    </div>

    <div>
        <button class="btn btn-success" (click)="makePurchase()">Purchase</button>
    </div>

</div>
